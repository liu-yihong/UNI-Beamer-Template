name: Build slides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with LuaLaTeX (latexmk + biber)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "*.tex"
          glob_root_file: true
          latexmk_use_lualatex: true

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: "*.pdf"
